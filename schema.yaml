  /api/v1/madadkar/payment/verify/:
    get:
      operationId: madadkar_payment_verify
      description: |-
        این endpoint توسط درگاه پرداخت بعد از تکمیل تراکنش فراخوانی می‌شود.

        ورودی شامل `authority` (و گاهی `status`) است که توسط درگاه به‌صورت query string یا body ارسال می‌گردد.

        این endpoint **idempotent** است: فراخوانی دوباره با همان authority نتیجه قبلی را برمی‌گرداند بدون تماس مجدد با درگاه.
      summary: تأیید پرداخت — callback از سمت درگاه
      parameters:
      - in: query
        name: authority
        schema:
          type: string
        required: true
      - in: query
        name: status
        schema:
          type: string
      tags:
      - مددکار — کاربر
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarPaymentVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
    post:
      operationId: madadkar_payment_verify_post
      description: |-
        Callback تأیید پرداخت — GET/POST /api/v1/madadkar/payment/verify/

        نکته مهم: این endpoint از سمت **درگاه پرداخت** فراخوانی می‌شود
        (نه مستقیم از طرف کلاینت ما). در زمان فراخوانی session کاربر
        معمولاً موجود نیست.

        بنابراین:
        - permission: AllowAny (verify بر اساس authority انجام می‌شود)
        - throttle: مخصوص (مبتنی بر IP)
        - method: هم GET (Zarinpal) و هم POST (سایر درگاه‌ها) پشتیبانی می‌شوند.
      summary: تأیید پرداخت — POST callback (درگاه‌های POST-based)
      tags:
      - مددکار — کاربر
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerifyCallback'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentVerifyCallback'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVerifyCallback'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarPaymentVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarGenericErrorResponse'
          description: ''
