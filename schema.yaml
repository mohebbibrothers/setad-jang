  /api/v1/madadkar/campaigns/{slug}/participate/:
    post:
      operationId: madadkar_user_participate
      description: |-
        کاربر لاگین‌کرده می‌تواند با وارد کردن تعداد سهم، فرآیند پرداخت را آغاز کند.

        **گام‌ها در سمت کلاینت:**
        1. این endpoint را با share_count فراخوانی کنید.
        2. به `gateway_url` ریدایرکت کنید.
        3. پس از بازگشت از درگاه، endpoint verify خودکار صدا زده می‌شود.

        **نکات امنیتی:**
        - سهم‌ها به محض initiate رزرو می‌شوند (تا 15 دقیقه).
        - اگر پرداخت موفق نشود، سهم‌ها خودکار آزاد می‌شوند.
        - قیمت سهم در لحظه ایجاد ثبت می‌شود (snapshot).
      summary: شروع مشارکت در حرکت
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - مددکار — کاربر
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationInitiate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParticipationInitiate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParticipationInitiate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MadadkarParticipationInitiatedResponse'
          description: ''
        '400':
          content:
            application/json:
