          readOnly: true
          title: تاریخ بروزرسانی
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          title: زمان بررسی
      required:
      - attachments
      - created_at
      - external_id
      - id
      - updated_at
    UserTabyinSubmissionDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        status_code:
          type: integer
          default: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserTabyinSubmissionDetail'
      required:
      - data
      - message
    UserTabyinSubmissionList:
      type: object
      description: List serializer for a user's own submitted contents.
      properties:
        id:
          type: integer
          readOnly: true
        external_id:
          type: string
          title: شناسه پایدار
          description: برای محتوای خارجی id منبع و برای محتوای کاربر local UUID است.
          maxLength: 64
        title:
          type: string
          title: عنوان
          maxLength: 512
        submission_status:
          allOf:
          - $ref: '#/components/schemas/SubmissionStatusEnum'
          title: وضعیت بررسی
        admin_note:
          type: string
          title: یادداشت ادمین
        attachments_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          title: زمان بررسی
      required:
      - attachments_count
      - created_at
      - external_id
      - id
    UserTabyinSubmissionListResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserTabyinSubmissionListResponseData'
        success:
          type: boolean
          default: true
        status_code:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
      - message
    UserTabyinSubmissionListResponseData:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserTabyinSubmissionList'
      required:
      - count
      - results
    UserTabyinSubmissionNotFound:
      type: object
      properties:
        success:
          type: boolean
          default: false
        status_code:
          type: integer
        message:
          type: string
        errors:
          nullable: true
      required:
      - message
      - status_code
    VerbEnum:
      enum:
      - created
      - submitted
      - updated
      - approved
      - rejected
      - replied
      - resolved
      - paid
      - issued
      - revealed
      - matched
      - notified
      type: string
      description: |-
        * `created` - ایجاد کرد
        * `submitted` - ارسال کرد
        * `updated` - بروزرسانی کرد
        * `approved` - تأیید شد
        * `rejected` - رد شد
        * `replied` - پاسخ دریافت کرد
        * `resolved` - حل شد
        * `paid` - پرداخت کرد
        * `issued` - صادر شد
        * `revealed` - مشاهده شد
        * `matched` - تطبیق یافت
        * `notified` - اعلان دریافت کرد
    VerifyEmail:
      type: object
      description: VerifyEmailSerializer implementation for the authentication application.
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          maxLength: 5
          minLength: 5
      required:
      - code
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://127.0.0.1:8000
  description: محیط توسعه (Local Development)
tags:
- name: احراز هویت — عمومی
  description: |-
    endpointهای عمومی احراز هویت شامل:
    - ثبت‌نام چندشناسه‌ای (ایمیل / موبایل)
    - ورود با رمز عبور یا کد یکبارمصرف
    - بازیابی رمز عبور
    - endpointهای منسوخ نسخه ۱ (deprecated)
- name: احراز هویت — کاربر
  description: |-
    endpointهای مخصوص کاربر لاگین کرده:
    - مشاهده و ویرایش پروفایل
    - مدیریت شناسه‌ها (اتصال، تأیید، تغییر اصلی)
    - تغییر رمز عبور
    - خروج
- name: احراز هویت — مدیریت
  description: endpointهای مدیریتی کاربران (فقط ادمین)
- name: گزارشات مردمی — عمومی
  description: ثبت گزارش و مشاهده موضوعات (بدون نیاز به لاگین)
- name: گزارشات مردمی — موضوعات (مدیریت)
  description: CRUD کامل موضوعات گزارش (فقط ادمین)
- name: گزارشات مردمی — گزارشات (مدیریت)
  description: مدیریت گزارش‌های دریافتی و تغییر وضعیت آن‌ها (فقط ادمین)
- name: تبیین — عمومی
  description: نمایش محتواهای جهاد تبیین در سایت (با cache بهینه)
- name: تبیین — مدیریت
  description: مدیریت محتواها و اجرای دستی همگام‌سازی (فقط ادمین)
- name: لاگ فعالیت — مدیریت
  description: مشاهده و جستجوی لاگ‌های فعالیت سیستم (فقط ادمین)
- name: جایزه‌ای برای عدالت — عمومی
  description: نمایش پروفایل مجرمین منتشرشده به همراه جوایز اعلامی (بدون نیاز به لاگین)
- name: جایزه‌ای برای عدالت — کاربر
  description: ارسال گزارش تکمیلی برای پروفایل مجرمین (نیازمند احراز هویت پایه)
- name: جایزه‌ای برای عدالت — تعیین جایزه
  description: تعیین، ویرایش و درخواست لغو جایزه برای مجرمین (نیازمند احراز هویت کامل
    و تکمیل پروفایل)
- name: جایزه‌ای برای عدالت — مدیریت
  description: مدیریت کامل پروفایل مجرمین، بررسی گزارشات و تأیید درخواست‌های لغو (فقط
    ادمین)
- name: مددکار — عمومی
  description: نمایش حرکت‌های خیریه و مددکاران به صورت عمومی (بدون نیاز به لاگین)
- name: مددکار — کاربر
  description: مشارکت در حرکت‌ها از طریق خرید سهم و پرداخت (نیازمند لاگین معمولی)
- name: مددکار — مدیریت (مددکاران)
  description: CRUD کامل نهادهای میزبان حرکت‌ها (فقط ادمین)
- name: مددکار — مدیریت (حرکت‌ها)
  description: ایجاد، انتشار، بستن و مدیریت کامل حرکت‌های خیریه و گالری تصاویر آن‌ها
    (فقط ادمین)
- name: مددکار — مدیریت (تحلیل و گزارش)
  description: مشاهده جزئیات مشارکت‌کنندگان، رتبه‌بندی و خروجی Excel حرفه‌ای از پرداخت‌های
    هر حرکت (فقط ادمین)
