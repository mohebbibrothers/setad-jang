        جزئیات یک محتوا با external_id.

        این endpoint با cache سطح selector بهینه شده است (TTL=۵ دقیقه، invalidation خودکار پس از sync یا تغییرات ادمین).
      summary: جزئیات محتوای تبیین
      parameters:
      - in: path
