        * `degraded` - degraded
    IdentifierAddRequest:
      type: object
      description: |-
        Request OTP for attaching or verifying a secondary identifier.

        Supported:
        - add a missing secondary identifier
        - re-verify the same attached but unverified identifier

        Not supported:
        - replacing an existing identifier in the same channel
      properties:
        identifier:
          type: string
          maxLength: 254
      required:
      - identifier
    IdentifierAddVerify:
      type: object
      description: Verify OTP for attaching or verifying a secondary identifier.
      properties:
        identifier:
          type: string
          maxLength: 254
        code:
          type: string
          maxLength: 5
          minLength: 5
      required:
      - code
      - identifier
    IdentifierForgotPasswordConfirm:
      type: object
      description: Confirm password reset by identifier + OTP + new password.
      properties:
        identifier:
          type: string
          maxLength: 254
        code:
          type: string
          maxLength: 5
          minLength: 5
        new_password:
          type: string
          writeOnly: true
      required:
      - code
      - identifier
      - new_password
    IdentifierForgotPasswordRequest:
      type: object
      description: Request password reset OTP by identifier.
      properties:
        identifier:
          type: string
          maxLength: 254
      required:
      - identifier
