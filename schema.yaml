openapi: 3.0.3
info:
  title: ستاد جنگ — API Documentation
  version: 2.0.0
  description: "## مستندات API پروژه ستاد جنگ\n\nاین داکیومنت تمام endpointهای backend
    پروژه ستاد جنگ را شامل می‌شود.\n\n---\n\n### \U0001F3D7 معماری پاسخ‌ها\n\nتمام
    پاسخ‌های موفق در یک **envelope استاندارد** قرار می‌گیرند:\n\n```json\n{\n  \"success\":
    true,\n  \"status_code\": 200,\n  \"message\": \"عملیات با موفقیت انجام شد.\",\n
    \ \"data\": { ... }\n}\n```\n\nتمام پاسخ‌های ناموفق نیز فرمت یکسانی دارند:\n\n```json\n{\n
    \ \"success\": false,\n  \"status_code\": 400,\n  \"message\": \"درخواست نامعتبر
    است.\",\n  \"errors\": { ... }\n}\n```\n\n---\n\n### \U0001F510 احراز هویت (نسخه
    ۲ — چندشناسه‌ای)\n\nاین API از **JWT (JSON Web Token)** و **سیستم احراز هویت چندشناسه‌ای**
    استفاده می‌کند.\n\n**روش‌های ثبت‌نام و ورود:**\n- ثبت‌نام با **ایمیل یا شماره
    موبایل** از طریق `/api/v1/auth/signup/request/`\n- ورود با **رمز عبور** از طریق
    `/api/v1/auth/login/password/`\n- ورود با **کد یکبارمصرف** از طریق `/api/v1/auth/login/otp/request/`\n-
    بروزرسانی توکن با `/api/v1/auth/token/refresh/`\n\n**مدیریت شناسه:**\n- اتصال
    شناسه ثانویه (ایمیل یا موبایل) از طریق `/api/v1/auth/identifiers/add/request/`\n-
    تغییر شناسه اصلی از طریق `/api/v1/auth/identifiers/make-primary/`\n\n> ⚠️ endpointهای
    نسخه ۱ (مثل `/register/` و `/login/`) هنوز فعال هستند ولی **منسوخ شده‌اند** و
    در نسخه‌های آینده حذف خواهند شد.\n\n---\n\n### \U0001F4E6 ماژول‌های پروژه\n\n-
    **احراز هویت** — ثبت‌نام چندشناسه‌ای، ورود، مدیریت شناسه، بازیابی رمز\n- **گزارشات
    مردمی** — ثبت گزارش و مدیریت موضوعات\n- **جهاد تبیین** — همگام‌سازی محتوا از منبع
    خارجی و نمایش گالری\n- **جایزه‌ای برای عدالت (R4J)** — پروفایل مجرمین، گزارشات
    تکمیلی و جوایز اعلامی\n- **مددکار** — مشارکت خیریه سهم‌محور با اتصال به درگاه
    پرداخت\n- **لاگ فعالیت** — ثبت فعالیت‌های حساس سیستم\n\n---\n\n### \U0001F6A6
    محدودیت‌های نرخ (Rate Limiting)\n\nهر endpoint بسته به نوعش throttle مخصوص خود
    را دارد. در صورت برخورد به `429 Too Many Requests`، چند ثانیه صبر کرده و دوباره
    تلاش کنید.\n\n---\n\n### \U0001F6E1 امنیت\n\n- **Anti-abuse:** honeypot detection،
    global OTP guard، constant-time responses\n- **Timing-attack mitigation:** dummy
    hash path در authentication backend\n- **Enumeration-safe:** endpointهای forgot
    password و login OTP وجود یا عدم وجود حساب را افشا نمی‌کنند\n- **High-trust operations:**
    عملیات حساس مثل تعیین جایزه نیازمند احراز هویت کامل (ایمیل + موبایل) و تکمیل پروفایل
    هستند\n- **Payment safety:** رزرو سهم با select_for_update، idempotent verify،
    expire خودکار تراکنش‌های راکد"
  contact:
    name: تیم توسعه ستاد جنگ
    email: m.h.mohebbi.1386@gmail.com
  license:
    name: Iran_Cyber_MA
paths:
  /api/v1/audit-logs/admin/logs/:
    get:
      operationId: audit_logs_admin_list
      description: |-
        دریافت لیست تمام لاگ‌های فعالیت سیستم با pagination و فیلتر.

        **فیلترهای موجود:**
        - `action`: نوع عملیات (مثل LOGIN_SUCCESS, REPORT_CREATED)
        - `user_id`: شناسه کاربر
        - `resource_type`: نوع منبع (user, report, tabyin_content, ...)
        - `resource_id`: شناسه منبع
        - `request_id`: شناسه درخواست (X-Request-ID)
        - `ip_address`: آدرس IP
        - `created_after` / `created_before`: بازه زمانی
        - `search`: جستجو در action, resource_type, resource_id

        نیازمند احراز هویت با نقش admin.
      summary: لیست لاگ‌های فعالیت
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: فیلتر بر اساس نوع عملیات (exact match)
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: فیلتر از تاریخ (ISO 8601)
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: فیلتر تا تاریخ (ISO 8601)
      - in: query
        name: ip_address
        schema:
          type: string
        description: فیلتر بر اساس آدرس IP
      - in: query
        name: page
        schema:
          type: integer
        description: شماره صفحه
      - in: query
        name: page_size
        schema:
          type: integer
        description: تعداد آیتم در هر صفحه (حداکثر ۱۰۰)
      - in: query
        name: request_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه درخواست (X-Request-ID)
      - in: query
        name: resource_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه منبع
      - in: query
        name: resource_type
        schema:
          type: string
        description: فیلتر بر اساس نوع منبع (user, report, tabyin_content, ...)
      - in: query
        name: search
        schema:
          type: string
        description: جستجو در action، resource_type و resource_id
      - in: query
        name: user_id
        schema:
          type: integer
        description: فیلتر بر اساس شناسه کاربر
      tags:
      - لاگ فعالیت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPaginatedListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
  /api/v1/audit-logs/admin/logs/{audit_log_id}/:
    get:
      operationId: audit_logs_admin_retrieve
      description: |-
        دریافت جزئیات کامل یک لاگ فعالیت شامل changes و extra_data.

        نیازمند احراز هویت با نقش admin.
      summary: جزئیات لاگ فعالیت
      parameters:
      - in: path
        name: audit_log_id
        schema:
          type: integer
        required: true
      tags:
      - لاگ فعالیت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetailResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: |-
        لیست تمام کاربران سیستم با pagination و قابلیت فیلتر.

        نیازمند احراز هویت با نقش admin.
      summary: لیست کاربران
      parameters:
      - in: query
        name: email
        schema:
          type: string
        description: فیلتر ایمیل با جستجوی icontains
      - in: query
        name: is_active
        schema:
          type: boolean
        description: فیلتر بر اساس فعال بودن کاربر
      - in: query
        name: is_email_verified
        schema:
          type: boolean
        description: فیلتر بر اساس تأیید ایمیل
      - in: query
        name: page
        schema:
          type: integer
        description: شماره صفحه
      - in: query
        name: page_size
        schema:
          type: integer
        description: تعداد آیتم در هر صفحه (حداکثر ۱۰۰)
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - user
        description: فیلتر نقش کاربر
      tags:
      - احراز هویت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminPaginatedSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
