    AdminSyncTaskDispatched:
      type: object
      description: |-
        سریالایزر پاسخ زمانی که sync با موفقیت در صف Celery قرار گرفت.

        این پاسخ فقط نشان می‌دهد task با موفقیت publish شده است،
        نه اینکه اجرا/تمام شده است.
      properties:
        task_id:
          type: string
          description: شناسه یکتای task برای پیگیری وضعیت.
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            حالت اجرای sync.

            * `full` - full
            * `incremental` - incremental
        status_url:
          type: string
          description: مسیری برای پیگیری وضعیت اجرا.
      required:
      - mode
      - status_url
      - task_id
    AdminSyncTaskStatus:
      type: object
      description: |-
        سریالایزر وضعیت یک task پس‌زمینه‌ی sync.

        قراردادها:
        - `state`: یکی از مقادیر استاندارد Celery (PENDING, STARTED, RETRY,
          SUCCESS, FAILURE, REVOKED).
        - `ready`: اگر task به وضعیت نهایی رسیده باشد True است.
        - `successful`: فقط برای taskهای ready مقدار معنادار دارد.
        - `result`: در حالت SUCCESS، آمار sync (همان شکل SyncStats).
        - `error`: در حالت FAILURE پیام/نوع خطا برای ادمین.
      properties:
        task_id:
          type: string
        state:
          type: string
        ready:
          type: boolean
        successful:
          type: boolean
          nullable: true
        result:
          allOf:
          - $ref: '#/components/schemas/SyncStats'
          nullable: true
        error:
          type: string
          nullable: true
      required:
      - ready
      - state
      - task_id
    AdminSyncTrigger:
      type: object
      description: |-
        سریالایزر درخواست اجرای دستی sync.

        این endpoint اجرای sync را به‌صورت async به Celery می‌سپارد و
        بلافاصله پاسخ می‌دهد. خود ادمین می‌تواند با task_id وضعیت اجرا
        را پیگیری کند.
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: incremental
          description: |-
            حالت همگام‌سازی: full یا incremental

            * `full` - full
            * `incremental` - incremental
