          description: ''
    patch:
      operationId: auth_admin_user_update
      description: ویرایش اطلاعات یک کاربر توسط ادمین.
      summary: ویرایش کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
    delete:
      operationId: auth_admin_user_delete
      description: غیرفعال کردن (soft delete) یک کاربر توسط ادمین.
      summary: غیرفعال کردن کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEmptySuccessResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
  /api/v1/auth/admin/users/{user_id}/role/:
    post:
      operationId: auth_admin_user_change_role
      description: |-
        تغییر نقش یک کاربر توسط ادمین.

        **نقش‌های موجود:**
        - `user`: کاربر عادی
