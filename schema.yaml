      type: object
      description: User/admin certificate representation.
      properties:
        id:
          type: integer
          readOnly: true
        certificate_code:
          type: string
          readOnly: true
        verification_slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
          - $ref: '#/components/schemas/LMSCertificateStatusEnum'
          readOnly: true
        course_id:
          type: integer
          readOnly: true
        course_title:
          type: string
          readOnly: true
        full_name_snapshot:
          type: string
          readOnly: true
        gender_snapshot:
          type: string
          readOnly: true
        national_code_snapshot:
          type: string
          readOnly: true
        course_title_snapshot:
          type: string
          readOnly: true
        instructor_name_snapshot:
          type: string
          readOnly: true
        score_out_of_20:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revocation_reason:
          type: string
          readOnly: true
        pdf_file:
          type: string
          format: uri
          readOnly: true
          nullable: true
        statement:
          type: string
          description: Return official certificate statement.
          readOnly: true
        verification_url:
          type: string
          description: Return absolute verification URL when request is available.
          readOnly: true
      required:
      - certificate_code
      - course_id
      - course_title
      - course_title_snapshot
      - full_name_snapshot
      - gender_snapshot
      - id
      - instructor_name_snapshot
      - issued_at
      - national_code_snapshot
      - pdf_file
      - revocation_reason
      - revoked_at
      - score_out_of_20
      - statement
      - status
      - verification_slug
      - verification_url
