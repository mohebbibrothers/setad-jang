components:
  schemas:
    AdminCampaignAnalytics:
      type: object
      description: آمار تجمیعی یک حرکت برای دشبورد ادمین.
      properties:
        total_participations:
          type: integer
          readOnly: true
        paid_participations:
          type: integer
          readOnly: true
        pending_participations:
          type: integer
          readOnly: true
        failed_participations:
          type: integer
          readOnly: true
        expired_participations:
          type: integer
          readOnly: true
        total_paid_amount:
          type: integer
          readOnly: true
        total_paid_shares:
          type: integer
          readOnly: true
        unique_paid_users:
          type: integer
          readOnly: true
        progress_percent:
          type: number
          format: double
          readOnly: true
        remaining_shares:
          type: integer
          readOnly: true
      required:
      - expired_participations
      - failed_participations
      - paid_participations
      - pending_participations
      - progress_percent
      - remaining_shares
      - total_paid_amount
      - total_paid_shares
      - total_participations
      - unique_paid_users
    AdminChangeRole:
      type: object
      description: AdminChangeRoleSerializer implementation for the authentication
        application.
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    AdminLeaderboardEntry:
      type: object
      description: یک ردیف از leaderboard — top contributors یک حرکت.
      properties:
        user_id:
          type: integer
          readOnly: true
        user_email:
          type: string
          readOnly: true
        user_display_name:
          type: string
          readOnly: true
        total_shares:
          type: integer
          readOnly: true
        total_amount:
          type: integer
          readOnly: true
        participations_count:
          type: integer
          readOnly: true
      required:
      - participations_count
      - total_amount
      - total_shares
      - user_display_name
      - user_email
      - user_id
    AdminParticipantDetail:
      type: object
      description: |-
        جزئیات مشارکت‌کننده برای نمایش در لیست admin participants.

        شامل اطلاعات کاربر، Payment و timing.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AdminUserSummary'
          readOnly: true
        share_count:
          type: integer
          readOnly: true
          title: تعداد سهم
        share_price_snapshot:
          type: integer
          readOnly: true
          title: قیمت سهم در لحظه خرید (تومان)
        total_amount:
          type: integer
          readOnly: true
          title: مبلغ کل (تومان)
        status:
          allOf:
          - $ref: '#/components/schemas/MadadkarParticipationStatusEnum'
          readOnly: true
          title: وضعیت
        status_display:
          type: string
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentUserSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: زمان پرداخت موفق
      required:
      - created_at
      - id
      - paid_at
      - payment
      - share_count
      - share_price_snapshot
      - status
      - status_display
      - total_amount
      - user
    AdminPaymentCampaignSummary:
      type: object
      description: خلاصه‌ای از Campaign برای نمایش در داخل Payment ادمین.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: عنوان حرکت
        slug:
          type: string
          readOnly: true
          title: شناسه URL
          description: در صورت خالی بودن، از روی عنوان به‌صورت خودکار ساخته می‌شود.
          pattern: ^[-\w]+$
        sponsor_name:
          type: string
          readOnly: true
      required:
      - id
      - slug
      - sponsor_name
      - title
    AdminPaymentList:
      type: object
