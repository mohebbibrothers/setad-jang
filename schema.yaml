          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
