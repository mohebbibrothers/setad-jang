        سیستم:**\n- نسخه پروژه، Django، Python\n- محیط اجرا (dev / staging / prod)\n-
        uptime سرور\n\n**کدهای پاسخ:**\n- `200 OK`: همه چیز سالم است (`status=ok`)\n-
        `200 OK` با `status=degraded`: عملکرد کند است\n- `503 Service Unavailable`:
        یک یا چند کامپوننت خطا دارد\n\nاین endpoint بدون throttle است."
