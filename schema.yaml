      operationId: activity_admin_retrieve
      description: Return paginated admin activity timeline.
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivity'
          description: ''
  /api/v1/activity/me/:
    get:
      operationId: activity_me_retrieve
      description: Return paginated current-user activity events.
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivity'
          description: ''
  /api/v1/admin/command-center/:
    get:
      operationId: admin_command_center_summary
      description: Return cross-app operational summary.
      tags:
      - مرکز فرماندهی مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCenterSummaryResponse'
          description: ''
  /api/v1/audit-logs/admin/logs/:
    get:
      operationId: audit_logs_admin_list
      description: |-
        دریافت لیست تمام لاگ‌های فعالیت سیستم با pagination و فیلتر.

        **فیلترهای موجود:**
        - `action`: نوع عملیات (مثل LOGIN_SUCCESS, REPORT_CREATED)
        - `user_id`: شناسه کاربر
        - `resource_type`: نوع منبع (user, report, tabyin_content, ...)
        - `resource_id`: شناسه منبع
        - `request_id`: شناسه درخواست (X-Request-ID)
        - `ip_address`: آدرس IP
        - `method`: متد HTTP
        - `path`: مسیر درخواست
        - `created_after` / `created_before`: بازه زمانی
        - `search`: جستجو در action, resource_type, resource_id

        نیازمند احراز هویت با نقش admin.
      summary: لیست لاگ‌های فعالیت
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: فیلتر بر اساس نوع عملیات (exact match)
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: فیلتر از تاریخ (ISO 8601)
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: فیلتر تا تاریخ (ISO 8601)
      - in: query
        name: ip_address
        schema:
          type: string
        description: فیلتر بر اساس آدرس IP
      - in: query
        name: method
        schema:
          type: string
        description: فیلتر بر اساس متد HTTP
      - in: query
        name: page
        schema:
          type: integer
        description: شماره صفحه
      - in: query
        name: page_size
        schema:
          type: integer
        description: تعداد آیتم در هر صفحه (حداکثر ۱۰۰)
      - in: query
        name: path
        schema:
          type: string
        description: فیلتر بر اساس مسیر درخواست
      - in: query
        name: request_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه درخواست (X-Request-ID)
      - in: query
        name: resource_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه منبع
      - in: query
        name: resource_type
        schema:
          type: string
        description: فیلتر بر اساس نوع منبع (user, report, tabyin_content, ...)
      - in: query
        name: search
        schema:
          type: string
        description: جستجو در action، resource_type و resource_id
      - in: query
        name: user_id
        schema:
          type: integer
        description: فیلتر بر اساس شناسه کاربر
      tags:
      - لاگ فعالیت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPaginatedListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
  /api/v1/audit-logs/admin/logs/{audit_log_id}/:
    get:
      operationId: audit_logs_admin_retrieve
      description: |-
        دریافت جزئیات کامل یک لاگ فعالیت شامل changes و extra_data.

        نیازمند احراز هویت با نقش admin.
      summary: جزئیات لاگ فعالیت
      parameters:
      - in: path
        name: audit_log_id
        schema:
          type: integer
        required: true
      tags:
      - لاگ فعالیت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetailResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
  /api/v1/audit-logs/admin/logs/export/:
    get:
      operationId: audit_logs_admin_export_forensic_package
      description: تولید بسته ZIP شامل `manifest.json`, `audit_logs.jsonl`, `audit_logs.csv`
        و `audit_logs.xlsx`. قبل از export، زنجیره هش کامل audit trail بررسی می‌شود
        و خود عملیات export نیز با action `AUDIT_PACKAGE_EXPORTED` ثبت می‌گردد.
      summary: خروجی بسته forensic لاگ‌های فعالیت
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: فیلتر بر اساس نوع عملیات (exact match)
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: فیلتر از تاریخ (ISO 8601)
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: فیلتر تا تاریخ (ISO 8601)
      - in: query
        name: ip_address
        schema:
          type: string
        description: فیلتر بر اساس آدرس IP
      - in: query
        name: method
        schema:
          type: string
        description: فیلتر بر اساس متد HTTP
      - in: query
        name: page
        schema:
          type: integer
        description: شماره صفحه
      - in: query
        name: page_size
        schema:
          type: integer
        description: تعداد آیتم در هر صفحه (حداکثر ۱۰۰)
      - in: query
        name: path
        schema:
          type: string
        description: فیلتر بر اساس مسیر درخواست
      - in: query
        name: request_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه درخواست (X-Request-ID)
      - in: query
        name: resource_id
        schema:
          type: string
        description: فیلتر بر اساس شناسه منبع
      - in: query
        name: resource_type
        schema:
          type: string
        description: فیلتر بر اساس نوع منبع (user, report, tabyin_content, ...)
      - in: query
        name: search
        schema:
          type: string
        description: جستجو در action، resource_type و resource_id
      - in: query
        name: user_id
        schema:
          type: integer
        description: فیلتر بر اساس شناسه کاربر
      tags:
      - لاگ فعالیت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ZIP forensic package
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogGenericErrorResponse'
          description: ''
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: |-
        لیست تمام کاربران سیستم با pagination و قابلیت فیلتر.

        نیازمند احراز هویت با نقش admin.
      summary: لیست کاربران
      parameters:
      - in: query
        name: email
        schema:
          type: string
        description: فیلتر ایمیل با جستجوی icontains
      - in: query
        name: is_active
        schema:
          type: boolean
        description: فیلتر بر اساس فعال بودن کاربر
      - in: query
        name: is_email_verified
        schema:
          type: boolean
        description: فیلتر بر اساس تأیید ایمیل
      - in: query
        name: page
        schema:
          type: integer
        description: شماره صفحه
      - in: query
        name: page_size
        schema:
          type: integer
        description: تعداد آیتم در هر صفحه (حداکثر ۱۰۰)
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - user
        description: فیلتر نقش کاربر
      tags:
      - احراز هویت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminPaginatedSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
  /api/v1/auth/admin/users/{user_id}/:
    get:
      operationId: auth_admin_user_retrieve
      description: دریافت اطلاعات کامل یک کاربر شامل پروفایل و وضعیت.
      summary: جزئیات کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminSuccessResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
    patch:
      operationId: auth_admin_user_update
      description: ویرایش اطلاعات یک کاربر توسط ادمین.
      summary: ویرایش کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
    delete:
      operationId: auth_admin_user_delete
      description: غیرفعال کردن (soft delete) یک کاربر توسط ادمین.
      summary: غیرفعال کردن کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEmptySuccessResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
  /api/v1/auth/admin/users/{user_id}/role/:
    post:
      operationId: auth_admin_user_change_role
      description: |-
        تغییر نقش یک کاربر توسط ادمین.

        **نقش‌های موجود:**
        - `user`: کاربر عادی
        - `admin`: مدیر سیستم
      summary: تغییر نقش کاربر
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - احراز هویت — مدیریت
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangeRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminChangeRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminChangeRole'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
  /api/v1/auth/identifiers/add/request/:
    post:
      operationId: auth_identifier_add_request
      description: |-
        ارسال کد تأیید برای اتصال ایمیل یا شماره موبایل جدید به حساب.

        موارد پشتیبانی‌نشده: جایگزینی یک شناسه‌ی موجود در همان channel.
      summary: درخواست اتصال شناسه ثانویه
      tags:
      - احراز هویت — کاربر
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifierAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifierAddRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEmptySuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationGenericErrorResponse'
          description: ''
        '401':
