  /api/v1/tabyin/admin/sync/:
    post:
      operationId: tabyin_admin_sync_dispatch
      description: |-
        اجرای همگام‌سازی محتوا از سایت محتوانگار به‌صورت **غیرهمزمان**.

        این endpoint task مربوط به sync را در صف Celery قرار می‌دهد و بلافاصله پاسخ می‌دهد. خود اجرای sync در پس‌زمینه انجام می‌شود.

        **حالت‌های موجود:**
        - `full`: همه صفحات پیمایش می‌شوند (سنگین‌تر)
        - `incremental`: فقط تغییرات اخیر (سریع‌تر)

        برای پیگیری وضعیت اجرا از endpoint وضعیت task استفاده کنید.

        پس از sync (در صورت وجود تغییر)، cache عمومی به‌صورت خودکار invalidate می‌شود.

        **Throttle:** حداکثر ۵ بار در ساعت.
      summary: اجرای دستی همگام‌سازی (غیرهمزمان) — ادمین
      tags:
      - تبیین — مدیریت
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSyncTrigger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminSyncTrigger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminSyncTrigger'
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncDispatchResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncDispatchBadRequestResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncDispatchForbiddenResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncDispatchThrottledResponse'
          description: ''
  /api/v1/tabyin/admin/sync/status/{task_id}/:
    get:
      operationId: tabyin_admin_sync_status
      description: |-
        نمایش وضعیت لحظه‌ای یک task پس‌زمینه‌ی sync.

        **مقادیر ممکن `state`:**
        - `PENDING`: هنوز اجرا نشده یا task_id نامعتبر است.
        - `STARTED`: در حال اجراست.
        - `RETRY`: درحال تلاش مجدد پس از خطا.
        - `SUCCESS`: با موفقیت تمام شده — `result` شامل آمار sync است.
        - `FAILURE`: شکست خورده — `error` شامل پیام خطاست.
        - `REVOKED`: لغو شده.

        برای taskهای ناتمام، فیلدهای `result` و `error` خالی هستند.
      summary: پیگیری وضعیت task همگام‌سازی — ادمین
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - تبیین — مدیریت
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncStatusResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSyncStatusForbiddenResponse'
          description: ''
  /api/v1/tabyin/contents/:
    get:
      operationId: tabyin_public_contents_list
      description: |-
        لیست محتواهای عمومی — پاسخ paginated و قابل فیلتر.

        **فیلترهای موجود:**
        - `media_type`: image / video / audio
