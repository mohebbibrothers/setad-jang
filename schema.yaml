        - `search`: جستجو در عنوان و توضیحات

        این endpoint با cache سطح selector بهینه شده است (TTL=۶۰ ثانیه، invalidation خودکار پس از sync یا تغییرات ادمین).
      summary: لیست محتواهای جهاد تبیین
      tags:
      - تبیین — عمومی
      security:
      - jwtAuth: []
      - {}
      responses:
