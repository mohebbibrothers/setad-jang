# ============================================================
# Project: Setad Jang
# Tooling configuration (Ruff, Pytest, Coverage)
# ============================================================
# هدف: یک فایل واحد برای پیکربندی ابزارهای کیفیت کد و تست.
# هرگاه ابزار جدیدی به پروژه اضافه شد، تنظیماتش هم همین‌جا اضافه می‌شود.
#
# اصول فعلی:
# - lint باید clean باشد
# - warningها در تست باید fail شوند (zero-warning policy)
# - config باید strict و production-minded بماند

# ════════════════════════════════════════════════════════════
# Ruff
# ════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py314"
line-length = 100

extend-exclude = [
    ".venv",
    ".venv-wsl",
    "migrations",
    "staticfiles",
    "media",
    "schema.yaml",
]

# ─── Linter ────────────────────────────────────────────────
[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "DJ",
    "RUF",
]

# ─── Ignored rules — همراه با rationale ────────────────────
ignore = [
    "E501",   # line-too-long — formatter به اندازه کافی مدیریت می‌کند
    "B008",   # function call in default arg — DRF/Django زیاد از این الگو دارد
    "RUF001", # ambiguous unicode (مثل کاراکترهای فارسی)
    "RUF002", # ambiguous docstring (مثل کاراکترهای فارسی)
    "RUF003", # ambiguous comment (مثل کاراکترهای فارسی)
    "DJ001",  # null=True on string fields — در پروژه گاهی نیاز است

    # ── Style decisions (intentional) ─────────────────────
    "RUF012", # ClassVar — در Django/DRF idiomatic نیست
    "SIM108", # ternary — در sync engine if/else خواناتر است
    "SIM118", # `key in dict.keys()` — explicit بودن گاهی readable‌تر است
    "C416",   # dict comprehension — alias-friendly و کم‌خطر است
    "UP040",  # TypeAlias — هنوز در صنعت معتبر است
    "UP047",  # PEP 695 generics — برای سطح بلوغ پروژه overengineering است
]

# ─── per-file ignores ──────────────────────────────────────
# توضیحات:
# - settings/*.py از star-import استاندارد Django settings استفاده می‌کند.
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py"             = ["E", "F", "I", "B", "UP", "SIM", "C4", "DJ", "RUF"]
"**/settings/*.py"               = ["F401", "F403", "F405"]
"manage.py"                      = ["E402"]
"**/tests/**/*.py"               = ["E501"]
"**/test_*.py"                   = ["E501"]
"conftest.py"                    = ["E402"]

# ─── Import sorting (isort) ────────────────────────────────
[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
combine-as-imports = true

# ─── Formatter ─────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

# ════════════════════════════════════════════════════════════
# Pytest
# ════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["apps", "tests"]

# نکته مهم:
# - warningها در پروژه نباید مخفی شوند.
# - هر warning باید تست را fail کند تا zero-warning discipline حفظ شود.
# - بنابراین به‌جای --disable-warnings از filterwarnings=["error"] استفاده می‌کنیم.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--reuse-db",
]

filterwarnings = [
    "error",
    # Python 3.14 emits this from drf-spectacular's type-hint plumbing while
    # generating OpenAPI. Keep zero-warning discipline for project code, but do
    # not fail CI on this upstream compatibility warning until the dependency
    # removes its Python-internal _UnionGenericAlias check.
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning",
]

markers = [
    "unit: تست‌های unit (سریع، بدون DB یا I/O)",
    "integration: تست‌های integration (با DB یا چند لایه واقعی)",
    "celery: تست‌های مرتبط با Celery tasks",
    "external: تست‌هایی که با mock به سرویس خارجی وصل می‌شوند",
    # ── Vendor markers ─────────────────────────────────────────────
    # تست‌ها با skipif بر اساس connection.vendor خودشان را در موتور نامرتبط
    # غیرفعال می‌کنند؛ این markers فقط برای اجرای هدفمند زیرمجموعه (مثلاً
    # گام سریع SQLite در CI) استفاده می‌شوند.
    "postgres: تست‌هایی که فقط روی PostgreSQL معنادارند (قفل همزمانی واقعی، FTS/trigram)",
    "sqlite: تست‌هایی که رفتار SQLite-specific را تأیید می‌کنند (fallback search، planهای EXPLAIN)",
    "redis: تست‌های یکپارچگیِ لایهٔ کش روی Redis واقعی (یافتۀ P2-7 فاز 8؛ در CI اجرا می‌شود، بدون redis skip)",
]

# ════════════════════════════════════════════════════════════
# mypy — یافتۀ P2-6 فاز 8 (قفل‌کردنِ بدهیِ type)
# ════════════════════════════════════════════════════════════
# فلسفۀ «progressive» و چرا strict نیست:
#     کد پروژه type-hint دارد ولی هرگز زیر type-checker نبوده؛ روشن‌کردنِ
#     strict یک‌شبه هزاران خطا می‌دهد و گیتِ بی‌ارزش (disable-per-line)
#     می‌سازد. اینجا خطاها را به گروه‌های *معنادارِ بدون-stub* محدود کردیم:
#     نام‌های تعریف‌نشده، آرگومان‌های غلط، ناسازگاری override/assign —
#     یعنی باگ‌هایی که ruff نمی‌بیند و تست هم ممکن است نپوشاندشان.
#     افزودن --strict بعداً یک commit تمیز است، نه شرطِ ورود.
#     کتابخانه‌های بدونِ type (celery/rest_framework/...) عمداً Any می‌مانند؛
#     mypy-django-plugin هم در فاز بعد (نیازمند pinِ هماهنگِ django-stubs).

[tool.mypy]
python_version = "3.13"
files = ["apps", "config"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = "(^|/)(migrations|tests)/"
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = false
# خطاهای بی‌ سروصدا ولی واقعی:
disallow_untyped_calls = false
disallow_untyped_defs = false
show_error_codes = true
no_implicit_optional = true
local_partial_types = true
# بک‌لاگِ صریح (مستند، نه سرِ‌هوایی): این کد家族‌ها روی 650 خطایِ انباشته
# روشن نمی‌شوند؛ هرکدام که با اصلاحِ واقعی صفر شد، از این لیست بیرون
# می‌آید. دو خانواده‌ای که همین حالا سبزند و فعال‌اند: var-annotated و
# no-redef و name-defined.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "dict-item",
    "has-type",
    "index",
    "list-item",
    "misc",
    "return-value",
    "type-var",
    "unreachable",
    "union-attr",
    "valid-type",
]

# ════════════════════════════════════════════════════════════
# Coverage
# ════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
