# ============================================================
# Setad Jang — Nginx reverse proxy (تک‌نقطهٔ ورودی)
# ============================================================
# چرا لازم است (یافتهٔ P3 ممیزی مستقل):
#   قبل از این، سرویس web مستقیماً روی 0.0.0.0:8000 منتشر می‌شد — بدون
#   TLS termination در ریپو و بدون یک لایهٔ واحد برای rate-limit حاشیه‌ای/
#   الگوبرداری. این config پروکسی معکوسِ web است:
#
#   - همهٔ ترافیک از یک نقطه می‌گذرد؛
#   - headerهای X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host
#     را تولید می‌کند؛ به همین دلیل در docker-compose مقدار NUM_PROXIES=1
#     است (فقط همین nginx قابل اعتماد است و XFF را بازنویسی می‌کند —
#     apps/core/client_ip.py مقادیر بعد از راستِ زنجیره را می‌خواند)؛
#   - مسیر Health بدون لاگ است (پروب‌ها log spam نکنند)؛
#   - TLS termination معمولاً در LB بالادست انجام می‌شود؛ اگر می‌خواهی
#     همین‌جا TLS کنی، certbot/cert را mount و پورت 443 را اضافه کن
#     (در DEPLOYMENT_RUNBOOK.md مستند شده است). SECURE_PROXY_SSL_HEADER
#     در settings با X-Forwarded-Proto هماهنگ است.
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    # آپلود مستقیمِ پیوست‌های «روایت‌های مردمی» (ویدئو تا ۱۰۰MB) + margin.
    client_max_body_size 110m;

    # ── گارد لبه‌ای لاگین ادمین (یافتهٔ P1-۳ فاز ۷) ──────────────────────
    # لایهٔ اولِ محافظت: DRF throttle به /admin/login/ نمی‌رسد و لایهٔ دوم
    # (apps.core.admin_guard) بر اساس «شکست» قفل می‌کند؛ اینجا خودِ «نرخ»
    # محدود می‌شود تا حجم تلاش‌های brute-force حتی به اپ هم نرسد.
    # zoneها per-IP‌اند؛ پاسخ more-than-rate طبق limit_req_status می‌شود.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=admin_area:10m rate=20r/s;
    limit_req_status 429;

    # جلوگیری از proxy spoofing: فقط از web upstream؛ هیچ header ورودی
    # از کاربر مستقیماً به app نمی‌رسد (فقط آنچه اینجا ست می‌شود).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_proto;  # F5: از پروکسیِ مجاز بپذیر، وگرنه $scheme
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    upstream setadjang_web {
        server web:8000;
        keepalive 32;
    }

    # ── زنجیرۀ اعتمادِ پروتکل (رفع F5 ممیزی ۲۰۲۶-۰۸-۳۰) ──────────────────
    # بازنویسیِ کورِ X-Forwarded-Proto با $scheme دو سمت فاجعه داشت:
    #   الف) TLS در پروکسیِ بیرونیِ host → اپ «http» می‌دید؛ SECURE_SSL_REDIRECT=True
    #      یعنی حلقۀ ۳۰۱ ابدی، False یعنی کوکیِ ناامن روی HTTPS (سکوتِ خطرناک).
    #   ب) اعتمادِ کور به $http_x_forwarded_proto → کلاینت می‌تواند «https» جا بزند
    #      و کوکی‌های Secure/هدرهای HSTS را دور بزند.
    # راهِ درست: XFP *فقط* از شبکه‌های مجاز (پروکسیِ هم‌میزبان/شبکه‌های خصوصی)
    # پذیرفته می‌شود؛ از بقیه، $scheme واقعیِ خودِ nginx.
    geo $trust_xfp {
        default 0;
        127.0.0.1 1;
        172.16.0.0/12 1;
        10.0.0.0/8 1;
        192.168.0.0/16 1;
    }
    map "$trust_xfp$http_x_forwarded_proto" $real_proto {
        "1https" https;
        "1http"  http;
        default  $scheme;
    }

    server {
        listen 80;

        # Health probes → بدون لاگ (آلودگی لاگ با پینگ‌های orchestrator).
        location = /api/v1/health/ {
            access_log off;
            proxy_pass http://setadjang_web;
        }
        location = /api/v1/health/ready/ {
            access_log off;
            proxy_pass http://setadjang_web;
        }

        # رسانه‌های عمومی (آپلودها و آینه‌های پیوستِ روایت‌ها) مستقیم از روی
        # volume مشترک سرو می‌شوند — بدون عبور از gunicorn. mount مربوطه در
        # docker-compose (media_data:/app/media:ro) لازم است. با Django
        # serve_public_media را می‌توان غیرفعال نگه داشت (SERVE_PUBLIC_MEDIA=False).
        location /media/ {
            alias /app/media/;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            access_log off;
        }

        # دقیقاً همان مسیر POST لاگین ادمین: ۶ درخواست/دقیقه با burst کوچک.
        # burst=4 nodelay یعنی ۶+۴ اوجِ کوتاه مجاز است (لاگین‌های متوالی
        # یک اپراتور واقعی)، ولی اسکنر/ربوتر زانو می‌زند. پاسخ ۴۲۹ مستقیم
        # از nginx است و به اپ نمی‌رسد.
        location = /admin/login/ {
            limit_req zone=admin_login burst=4 nodelay;
            proxy_pass http://setadjang_web;
        }

        # پنل ادمین (پس از ورود): نرخ معقولِ تعامل انسان؛ محافظت در برابر
        # اسکرپ‌کردن انبوه پنل یا DoS روی viewهای سنگین admin.
        location /admin/ {
            limit_req zone=admin_area burst=40 nodelay;
            proxy_pass http://setadjang_web;
        }

        location / {
            proxy_pass http://setadjang_web;
            proxy_read_timeout 60s;
        }
    }
}
