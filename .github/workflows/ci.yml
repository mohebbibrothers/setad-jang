name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: setadjang
          POSTGRES_USER: setadjang
          POSTGRES_PASSWORD: strong-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U setadjang -d setadjang"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # ── تست‌ها روی PostgreSQL اجرا می‌شوند (نه SQLite) ─────────────────
      # دلیل: `config.settings.development` روی SQLite قفل است و SQLite
      # `select_for_update` را بی‌صدا حذف می‌کند (یعنی تست همزمانی دروغین
      # سبز می‌شود)، full-text search و شاخهٔ postgres را تمرین نمی‌کند و
      # رفتار خالی/NULL و case sensitivity را می‌پوشاند. `config.settings.test`
      # با `DATABASE_ENGINE=postgres` همان موتور production را می‌دهد.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_ENGINE: postgres
      POSTGRES_DB: setadjang
      POSTGRES_USER: setadjang
      POSTGRES_PASSWORD: strong-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-secret-key-with-more-than-fifty-characters-for-setad-jang
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CACHE_BACKEND: locmem
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      OTP_PROVIDER: email
      MADADKAR_PAYMENT_PROVIDER: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
            requirements-dev-lock.txt

      - name: Install dependencies
        run: make install

      - name: Verify dependency graph
        run: make pip-check

      - name: Dependency lock drift check
        run: make lock-check

      - name: Security gate
        run: make security

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      - name: Django system check
        run: make check

      - name: Django deploy check
        run: make deploy-check

      - name: Migration drift check
        run: make migrations-check

      - name: STRUCTURE.md drift check
        run: make structure-check

      # نکته: «make schema-check» خودش DJANGO_SETTINGS_MODULE را برای تولید
      # schema به config.settings.development پین می‌کند (توضیح در Makefile).
      # اگر پین شود، schema با env این job (settings.test + PostgreSQL) تولید
      # می‌شود و bounds فیلدهای عددی (int32/int16 به‌جای int64 در SQLite) با
      # schema.yaml فرق می‌کند؛ drift مثبت کاذب. در ران ۲۲۷ همین اتفاق افتاد.
      - name: OpenAPI schema validation and drift check
        run: make schema-check SCHEMA_OUTPUT=schema-ci.yaml

      - name: Test suite on PostgreSQL with coverage gate
        run: make coverage-postgres

      # برعکسِ مسیر اصلی: تست‌های SQLite-specific (marker=sqlite) را هم اجرا
      # کن چون در اجرای PostgreSQL به‌طور خودکار skip می‌شوند (fallback
      # جست‌وجو و planهای EXPLAIN فقط روی SQLite معنا دارند).
      - name: SQLite vendor-specific tests
        run: make test-sqlite-vendor

      - name: Upload validated schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-ci
          path: schema-ci.yaml
          if-no-files-found: ignore
