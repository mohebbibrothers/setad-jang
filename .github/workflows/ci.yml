name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: setadjang
          POSTGRES_USER: setadjang
          POSTGRES_PASSWORD: strong-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U setadjang -d setadjang"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # ── تست‌ها روی PostgreSQL اجرا می‌شوند (نه SQLite) ─────────────────
      # دلیل: `config.settings.development` روی SQLite قفل است و SQLite
      # `select_for_update` را بی‌صدا حذف می‌کند (یعنی تست همزمانی دروغین
      # سبز می‌شود)، full-text search و شاخهٔ postgres را تمرین نمی‌کند و
      # رفتار خالی/NULL و case sensitivity را می‌پوشاند. `config.settings.test`
      # با `DATABASE_ENGINE=postgres` همان موتور production را می‌دهد.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_ENGINE: postgres
      POSTGRES_DB: setadjang
      POSTGRES_USER: setadjang
      POSTGRES_PASSWORD: strong-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-secret-key-with-more-than-fifty-characters-for-setad-jang
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CACHE_BACKEND: locmem
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      OTP_PROVIDER: email
      MADADKAR_PAYMENT_PROVIDER: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 — pinned 2026-08-30 (audit F3); dependabot bumps

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 — pinned 2026-08-30 (audit F3); dependabot bumps
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
            requirements-dev-lock.txt

      - name: Install dependencies
        run: make install

      - name: Verify dependency graph
        run: make pip-check

      - name: Dependency lock drift check
        run: make lock-check

      - name: Security gate
        run: make security

      - name: Ruff lint
        run: make lint

      - name: Type gate (mypy)
        run: make mypy

      - name: Ruff format check
        run: make format-check

      - name: Django system check
        run: make check

      - name: Django deploy check
        run: make deploy-check

      - name: Migration drift check
        run: make migrations-check

      - name: STRUCTURE.md drift check
        run: make structure-check
      # رفع F4/F5 ممیزی: خرابیِ compose/nginx نباید اولین بار روی سرور کشف شود.
      # compose config تمامِ `:?`ها و interpolate را زنده می‌سنجد؛ nginx -t
      # سینتکک/متغیرهای map/geo را (web به‌عنوان host جعلی resolve می‌شود).
      - name: Compose & nginx config validation
        run: |
          # compose v2 موجودیت service-level env_file را الزامی می‌کند؛ فایل را
          # *خالی* می‌سازیم نه copy-from-example: محتوای .env از طریق
          # python-decouple به خودِ اپ هم نشت می‌کند (این تله، یک‌بار CI را
          # با OPENAPI_SERVER_URL='' به schema-drift کشاند).
          [ -f .env ] || : > .env
          trap 'rm -f .env' EXIT
          POSTGRES_PASSWORD=ci-secret FLOWER_USER=ci FLOWER_PASSWORD=ci \
            docker compose -f docker-compose.yml config -q
          docker run --rm --add-host web:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      # نکته: «make schema-check» خودش DJANGO_SETTINGS_MODULE را برای تولید
      # schema به config.settings.development پین می‌کند (توضیح در Makefile).
      # اگر پین شود، schema با env این job (settings.test + PostgreSQL) تولید
      # می‌شود و bounds فیلدهای عددی (int32/int16 به‌جای int64 در SQLite) با
      # schema.yaml فرق می‌کند؛ drift مثبت کاذب. در ران ۲۲۷ همین اتفاق افتاد.
      - name: OpenAPI schema validation and drift check
        run: make schema-check SCHEMA_OUTPUT=schema-ci.yaml

      - name: Test suite on PostgreSQL with coverage gate
        run: make coverage-postgres

      # برعکسِ مسیر اصلی: تست‌های SQLite-specific (marker=sqlite) را هم اجرا
      # کن چون در اجرای PostgreSQL به‌طور خودکار skip می‌شوند (fallback
      # جست‌وجو و planهای EXPLAIN فقط روی SQLite معنا دارند).
      - name: SQLite vendor-specific tests
        run: make test-sqlite-vendor

      # یافتۀ P2-7 فاز 8: کل لایۀ سفارشیِ کش (JSON+zlib serializer،
      # namespace-version، SWR envelope) روی Redis *واقعی* آزموده می‌شود؛
      # db شمارهٔ ۲ تا با هیچ چیزِ دیگری در این job تداخل نکند. در نبودِ
      # redis تست‌ها skip می‌شوند (نه fail).
      - name: Cache layer on real Redis
        env:
          CACHE_BACKEND: redis
          REDIS_URL: redis://127.0.0.1:6379/2
        run: make test-redis

      - name: Upload validated schema artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4 — pinned 2026-08-30 (audit F3); dependabot bumps
        with:
          name: schema-ci
          path: schema-ci.yaml
          if-no-files-found: ignore
