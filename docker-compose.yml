# ============================================================
# Setad Jang — Production-grade local orchestration
# ============================================================

name: setadjang

x-app-env: &app_env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DEBUG: "False"
  ALLOWED_HOSTS: "127.0.0.1,localhost"
  CACHE_BACKEND: redis
  # رفع F4 ممیزی: رمزِ اختیاریِ redis — REDIS_PASSWORD خالی یعنی همان
  # رفتارِ بی‌رمزِ سابق (dev بدونِ اصطکاک)؛ روی سرور ستش کن تا هر
  # فرآیندِ هم‌شبکه نتواند کش/throttle/broker را مسموم کند.
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  DATABASE_ENGINE: postgres
  # یافتۀ P3-18 فاز 8: مسیر پیش‌فرض SQLite (BASE_DIR/db.sqlite3) بیرونِ
  # volumeِ db_data بود — هرکس compose را با DATABASE_ENGINE=sqlite بالا
  # بیاورد، دیتابیسش با rmِ کانتینر می‌مرد. این پین، sqlite را هم داخل
  # volume می‌اندازد؛ توسعهٔ لوکال (خارج compose) دست‌نخورده می‌ماند.
  DATABASE_PATH: /app/data/db.sqlite3
  POSTGRES_DB: ${POSTGRES_DB:-setadjang}
  POSTGRES_USER: ${POSTGRES_USER:-setadjang}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # ── Client IP (یافتهٔ P1 ممیزی) ──
  # در این توپولوژی دقیقاً یک پراکسی قابل اعتماد (سرویس nginx همین فایل)
  # جلوتر از web است و خودش X-Forwarded-For را بازنویسی می‌کند؛ پس
  # NUM_PROXIES=1 درست است. اگر nginx را حذف کردی، این را 0 بگذار تا
  # XFF ورودی هرگز معتبر نشود (fail-closed در apps/core/client_ip.py).
  NUM_PROXIES: "1"
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "0"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # raise-on-previous-save: آخرین save خراب = مرگِ کش نه خاموشیِ بی‌صدا.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - 3600 1 600 100 300 10000
      - --stop-writes-on-bgsave-error
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512M}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s


  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # یافتۀ P2-11 فاز 8: آرشیو WAL روی همان volume مشترکِ بکاپ — PITR تا
    # پنجرۀ BACKUP_WAL_KEEP_DAYS (پاک‌سازیاش با سرویس backup انجام می‌شود).
    # archive_timeout=300 یعنی RPO عملاً ≤۵ دقیقه، نه «تا آخرین dump».
    # توجه: تغییرِ wal_level/archived برای DB موجود با restart اعمال می‌شود
    # (اینیسیال‌سازیِ دوباره لازم نیست)؛ اگر روزی خاموشش کردی، runbook §7 را
    # هم به‌روز کن تا ادعای PITR در مستندات نماند.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test -d /backups/wal || mkdir -p /backups/wal; cp %p /backups/wal/%f
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setadjang}
      POSTGRES_USER: ${POSTGRES_USER:-setadjang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-3072M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: setadjang:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-2048M}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      GUNICORN_WORKERS: "3"
    # انتشار فقط روی loopback هاست: ترافیک عمومی باید از سرویس nginx
    # (پایین همین فایل) عبور کند؛ همین باعث می‌شود X-Forwarded-For
    # قابل اعتماد و NUM_PROXIES=1 معتبر باشد (یافتهٔ P3 ممیزی: «web بدون proxy»).
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
    volumes:
      - db_data:/app/data
      - static_data:/app/staticfiles
      - media_data:/app/media
    # healthcheck واقعی (یافتهٔ P3 ممیزی: «web بدون healthcheck»): wait-for
    # فقط process را می‌سنجد؛ این، پاسخِ واقعی /health/ را می‌سنجد و کارگرها
    # با service_healthy صبر می‌کنند تا migrate تمام شود.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Reverse proxy (یافتهٔ P3 ممیزی: «web بدون proxy در compose») ──
  # تنها نقطهٔ ورود عمومی؛ web فقط روی loopback هاست باز است.
  # ALLOWED_HOSTS باید دامنهٔ واقعی را شامل باشد و در صورت TLS در LB،
  # SECURE_PROXY_SSL_HEADER از قبل با X-Forwarded-Proto هماهنگ است.
  # ── Backup daemon (یافتۀ P2-11 فاز 8) ─────────────────────────────────
  # pg_dump دوره‌ای + sha256 + retention + verify چرخشی (restore واقعی در
  # DB موقت). ایمیج = همان postgres:17-alpine تا نسخهٔ pg_dump/pg_restore
  # با سرور قفل بماند (driftِ نسخه = restoreِ شکسته). سلامت‌سنجی: سنِ
  # فایلِ .backup_ok باید کمتر از ۳×اینتروال باشد — سکوتِ سرویس یعنی مرگ.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEM_LIMIT:-1024M}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-setadjang}
      PGUSER: ${POSTGRES_USER:-setadjang}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_WAL_KEEP_DAYS: ${BACKUP_WAL_KEEP_DAYS:-7}
      BACKUP_VERIFY_EVERY: ${BACKUP_VERIFY_EVERY:-4}
      # رفع F1 ممیزی: پایهٔ فیزیکیِ روزانه — بدونش WAL یتیم است و PITR توهم.
      BASE_BACKUP_INTERVAL_SECONDS: ${BASE_BACKUP_INTERVAL_SECONDS:-86400}
      BASE_BACKUP_KEEP_DAYS: ${BASE_BACKUP_KEEP_DAYS:-7}
    networks:
      - internal
    volumes:
      - backup_data:/backups
      - ./deploy/backup:/backup:ro
    entrypoint: ["/bin/sh", "/backup/backup_loop.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ok=/backups/.backup_ok; [ -f $$ok ] || exit 1; age=$(( $(date +%s) - $(stat -c %Y $$ok) )); [ $$age -lt $(( ${BACKUP_INTERVAL_SECONDS:-21600} * 3 )) ]",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEM_LIMIT:-256M}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # سرو مستقیمِ /media/ (آپلودها و آینه‌های پیوستِ روایت‌ها) از روی volume
      # مشترکِ رسانه — فقط‌خواندنی برای nginx.
      - media_data:/app/media:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    image: setadjang:latest
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1536M}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    networks:
      - internal
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    # فقط صف‌های عمومی/همگام‌سازی — صف madadkar جدا شده است (یافتهٔ ممیزی ۵.۲).
    # دلیل: یک تسک سنگین tabyin_sync نباید slotهای صف madadkar را اشغال کند
    # و تأیید پرداخت/بستن کمپین را پشت خود نگه دارد.
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
        "-Q",
        "default,tabyin_sync",
      ]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── worker اختصاصی صف madadkar ─────────────────────────────────────────
  # ممیزی ۵.۲: سه تسک مالی (expire_stale_participations،
  # close_expired_campaigns، generate_financial_control_snapshot) صف
  # اختصاصی داشتند ولی همان استخر مشترک آن‌ها را مصرف می‌کرد. این سرویس
  # concurrency مستقل دارد تا:
  #   * بار سفارشی دوره‌ای (مثلاً بستن کمپین‌های منقضی) با پردازش یک‌جا
  #     و بدون رقابت با default توزیع شود؛
  #   * وقتی کارهای سنگین tabyin/core در جریان‌اند، slot کارهای مالی باقی
  #     بماند (دربارهٔ visibility_timeout=2×TIME_LIMIT و قفل‌های select_for_update
  #     در financial control snapshot حساس است).
  madadkar-worker:
    image: setadjang:latest
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${MADADKAR_WORKER_MEM_LIMIT:-1024M}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    networks:
      - internal
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "-Q",
        "madadkar",
      ]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    image: setadjang:latest
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${BEAT_MEM_LIMIT:-512M}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    networks:
      - internal
    volumes:
      - db_data:/app/data
      - beat_data:/app/data/beat
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=info",
        "--schedule=/app/data/beat/celerybeat-schedule",
      ]
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/data/beat/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  flower:
    image: setadjang:latest
    restart: unless-stopped
    # رفع F4 ممیزی: سقفِ منابع — worker بدخواب نباید host را بکشد؛
    # همه env-tunable (روی سرورِ کوچک بالا/پایینش کن).
    deploy:
      resources:
        limits:
          memory: ${FLOWER_MEM_LIMIT:-512M}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      madadkar-worker:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      FLOWER_USER: ${FLOWER_USER:?FLOWER_USER must be set}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    # فقط روی loopback هاست publish می‌شود. قبلاً روی 0.0.0.0:5555 باز بود،
    # یعنی هر کسی با دسترسی شبکه‌ای به سرور می‌توانست آرگومان تمام تسک‌ها را
    # ببیند (user_id، ip_address، authority پرداخت، محتوای audit) و حتی
    # تسک‌ها را revoke یا worker را shutdown کند. برای دسترسی از راه دور از
    # SSH tunnel یا یک reverse proxy با احراز هویت استفاده کنید.
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - internal
    # basic-auth اجباری است: compose بدون FLOWER_USER/FLOWER_PASSWORD اصلاً
    # بالا نمی‌آید. دفاع لایه‌ای در کنار bind روی loopback.
    command:
      [
        "celery",
        "-A",
        "config",
        "flower",
        "--port=5555",
        "--address=0.0.0.0",
        "--basic-auth=${FLOWER_USER:?FLOWER_USER must be set}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}",
      ]
    # healthcheck باید credential بدهد، وگرنه بعد از فعال شدن basic-auth
    # همیشه 401 می‌گیرد و کانتینر برای همیشه unhealthy علامت می‌خورد.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${FLOWER_USER}:$${FLOWER_PASSWORD}\" http://127.0.0.1:5555/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  # /backups — dumpهای منطقی + WAL آرشیو + پرچم‌های سلامت (سرویس backup).
  backup_data:
  redis_data:
  static_data:
  media_data:
  db_data:
  beat_data: